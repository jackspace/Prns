#   cargo t-echo           build the LilyGo T-Echo firmware
#   cargo heltec-t114      build the Heltec Mesh Node T114 firmware

[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
rustflags = [
    "-C", "link-arg=-Tlink.x",
]

[alias]
t-echo = "build --release -p hopspot-t-echo"
heltec-t114 = "build --release -p hopspot-heltec-t114"

[package]
name = "hopspot-heltec-t114"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Personal Hopspot firmware for the Heltec Mesh Node T114 (nRF52840 + SX1262 + 240x135 ST7789 TFT)"

[dependencies]
personal-hopspot-nrf52840 = { path = "../.." }
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
panic-halt = "1.0"

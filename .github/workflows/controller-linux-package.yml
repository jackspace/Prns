name: controller-linux-package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  # ESP toolchain is x86_64-oriented; build the firmware tree once and hand it to
  # each Linux packager (including aarch64) via --firmware-from.
  firmware:
    name: tree firmware (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
          targets: thumbv7em-none-eabihf,riscv32imac-unknown-none-elf
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: controller-linux-firmware
          workspaces: |

      - name: Install ESP release toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/prns release toolchain esp install -- "${RUNNER_TEMP}/prns-esp-tools"

      - name: Build hopspot-flash + stage firmware tree
        run: |
          cargo build --release --locked -p hopspot-flash
          ./tools/prns run release.controller.firmware.stage -- \
            --out-dir target/controller-firmware-staging \
            --hopspot-flash target/release/hopspot-flash
          test -f target/controller-firmware-staging/firmware/bundle.json
          test -f target/controller-firmware-staging/firmware/heltec-v4/target.json
          test -f target/controller-firmware-staging/firmware/heltec-v4-r8/target.json
          test -f target/controller-firmware-staging/firmware/mesh-tower-v2/target.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controller-tree-firmware
          path: target/controller-firmware-staging/firmware
          if-no-files-found: error
          retention-days: 2

  package:
    name: unsigned Linux Controller (${{ matrix.arch }})
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: controller-linux-package-${{ matrix.arch }}
          workspaces: |
            .
            personal-hopspot/remote-control-desktop

      - uses: cargo-bins/cargo-binstall@57726869e28f4038a847ec56e5fdd9142fded110
        with:
          version: "1.21.0"

      - name: Install system deps for Dioxus desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Install exact Dioxus CLI
        run: cargo binstall --locked --no-confirm --force dioxus-cli@0.7.5

      - name: Download tree firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: controller-tree-firmware
          path: target/controller-firmware-from

      - name: Package unsigned Controller portable
        run: |
          dx --version | grep -E '(^| )0\.7\.5($| )'
          test -f target/controller-firmware-from/bundle.json
          ./tools/prns run release.controller.linux.package -- \
            --out-dir target/controller-linux \
            --firmware-from target/controller-firmware-from

      - name: Confirm embedded hopspot-flash
        run: |
          dest="target/controller-linux/PRNS-Controller"
          test -d "$dest"
          test -x "$dest/personal-hopspot-remote-control-desktop"
          test -x "$dest/hopspot-flash"
          "$dest/hopspot-flash" --version
          test -f "$dest/HOPSPOT_FLASH_VERSION.txt"
          test -f "$dest/firmware/bundle.json"
          test -f "$dest/firmware/heltec-v4/target.json"
          test -f "$dest/firmware/heltec-v4-r8/target.json"
          test -f "$dest/firmware/mesh-tower-v2/target.json"
          test -f "target/controller-linux/PRNS-Controller-linux-${{ matrix.arch }}-unsigned.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PRNS-Controller-linux-${{ matrix.arch }}-unsigned
          path: target/controller-linux/PRNS-Controller-linux-${{ matrix.arch }}-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 14

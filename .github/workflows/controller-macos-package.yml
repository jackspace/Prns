name: controller-macos-package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  # ESP release toolchain install is Linux-only; build the Flash firmware tree here
  # and hand it to each macOS packager via --firmware-from.
  firmware:
    name: tree firmware (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
          targets: thumbv7em-none-eabihf,riscv32imac-unknown-none-elf
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: controller-macos-firmware
          workspaces: |

      - name: Install ESP release toolchain
        env:
          # espup hits the GitHub API; unauthenticated runners get 403 rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/prns release toolchain esp install -- "${RUNNER_TEMP}/prns-esp-tools"

      - name: Build hopspot-flash + stage firmware tree
        run: |
          cargo build --release --locked -p hopspot-flash
          ./tools/prns run release.controller.firmware.stage -- \
            --out-dir target/controller-firmware-staging \
            --hopspot-flash target/release/hopspot-flash
          test -f target/controller-firmware-staging/firmware/bundle.json
          test -f target/controller-firmware-staging/firmware/heltec-v4/target.json
          test -f target/controller-firmware-staging/firmware/heltec-v4-r8/target.json
          test -f target/controller-firmware-staging/firmware/mesh-tower-v2/target.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controller-tree-firmware
          path: target/controller-firmware-staging/firmware
          if-no-files-found: error
          retention-days: 2

  package:
    name: unsigned macOS Controller (${{ matrix.arch }})
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: controller-macos-package-${{ matrix.arch }}
          workspaces: |
            .
            personal-hopspot/remote-control-desktop

      - uses: cargo-bins/cargo-binstall@57726869e28f4038a847ec56e5fdd9142fded110
        with:
          version: "1.21.0"

      - name: Install exact Dioxus CLI
        run: cargo binstall --locked --no-confirm --force dioxus-cli@0.7.5

      - name: Download tree firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: controller-tree-firmware
          path: target/controller-firmware-from

      - name: Package unsigned Controller .app
        run: |
          dx --version | grep -E '(^| )0\.7\.5($| )'
          test -f target/controller-firmware-from/bundle.json
          ./tools/prns run release.controller.macos.package -- \
            --out-dir target/controller-macos \
            --firmware-from target/controller-firmware-from

      - name: Confirm embedded hopspot-flash
        run: |
          app="$(find target/controller-macos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$app"
          test -x "$app/Contents/Resources/hopspot-flash"
          "$app/Contents/Resources/hopspot-flash" --version
          test -f "$app/Contents/Resources/HOPSPOT_FLASH_VERSION.txt"
          test -f "$app/Contents/Resources/firmware/bundle.json"
          test -f "$app/Contents/Resources/firmware/heltec-v4/target.json"
          test -f "$app/Contents/Resources/firmware/heltec-v4-r8/target.json"
          test -f "$app/Contents/Resources/firmware/mesh-tower-v2/target.json"
          test -f "target/controller-macos/PRNS-Controller-macos-${{ matrix.arch }}-unsigned.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PRNS-Controller-macos-${{ matrix.arch }}-unsigned
          path: target/controller-macos/PRNS-Controller-macos-${{ matrix.arch }}-unsigned.zip
          if-no-files-found: error
          retention-days: 14
